name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: admin
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Backend Dependencies
        run: |
          cd api
          uv sync --dev

      - name: Install Frontend Dependencies
        run: |
          cd web
          bun install

      - name: Run pre-commit hooks
        if: github.event_name != 'release'
        run: |
          export DJANGO_SETTINGS_MODULE=apps.settings
          export PYTHONPATH=$PYTHONPATH:$(pwd)/api
          uv run --project api pre-commit run --all-files --config .pre-commit-config.yaml

      - name: Run Frontend Lint
        if: github.event_name != 'release'
        run: |
          cd web
          bun run lint

      - name: Run Frontend Type Check
        if: github.event_name != 'release'
        run: |
          cd web
          bun x tsc

      - name: Run Backend Tests
        env:
          DJANGO_SETTINGS_MODULE: apps.settings
          POSTGRES_DB: admin
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          GOOGLE_API_KEY: dummy_key
        run: |
          cd api
          uv run pytest

      - name: Run Frontend Tests
        run: |
          cd web
          bun test

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          target: production
          push: ${{ github.event_name == 'release' && github.event.action == 'published' || github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/yashvardhankumar/coderacer-web-api:latest
            ghcr.io/yashvardhankumar/coderacer-web-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          target: production
          build-args: |
            NEXT_PUBLIC_BASE_URL=https://www.codeflip.co.in
          push: ${{ github.event_name == 'release' && github.event.action == 'published' || github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/yashvardhankumar/coderacer-web-web:latest
            ghcr.io/yashvardhankumar/coderacer-web-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [lint-and-test, build-and-push]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 # Updated to Mumbai region

      - name: Whitelist Runner IP
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd coderacer-web
            git stash 2>/dev/null || true
            git pull origin master
            chmod +x scripts/optimize-deploy.sh
            ./scripts/optimize-deploy.sh

      - name: Revoke Runner IP
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
